name: Пары Губкина — напоминания

on:
  schedule:
    - cron: "*/5 * * * *"   # UTC = каждые 5 минут по московскому времени тоже
  workflow_dispatch:
    inputs:
      test-push:
        description: "Отправить только тестовое сообщение в Telegram"
        type: boolean
        default: false
      verbose:
        description: "Подробный лог (печатает названия предметов в логи запуска)"
        type: boolean
        default: false

permissions:
  contents: write   # чтобы коммитить sent_state.json и keepalive

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Moscow
      LK_LOGIN: ${{ secrets.LK_LOGIN }}
      LK_PASSWORD: ${{ secrets.LK_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VERBOSE_PERSONAL: ${{ inputs.verbose && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверка доступности lk.gubkin.ru
        run: curl -s -o /dev/null -w "lk.gubkin.ru ответил HTTP %{http_code}\n" --max-time 20 https://lk.gubkin.ru/

      - name: Тестовое сообщение
        if: ${{ inputs.test-push }}
        run: python3 gubkin_notify.py --test-push

      - name: Напоминания о парах
        if: ${{ !inputs.test-push }}
        run: python3 gubkin_notify.py

      - name: Сохранить состояние и keepalive
        if: ${{ !inputs.test-push }}
        run: |
          git config user.name "gubkin-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git add sent_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "состояние не менялось"
          else
            git commit -m "state: $(date +%F)"
            git push
          fi
          # GitHub отключает расписание после 60 дней без коммитов в репозиторий;
          # поэтому если последний коммит старше суток — делаем пустой keepalive
          LAST=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          NOW=$(date +%s)
          if [ $((NOW - LAST)) -gt 90000 ]; then
            git commit --allow-empty -m "keepalive $(date +%F)" && git push
          fi
