name: Гео-тест связности
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for host in lk.gubkin.ru www.gubkin.ru api.telegram.org yandex.ru; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "https://$host/" || echo FAIL)
            echo "$host -> $code"
          done
